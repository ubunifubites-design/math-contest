<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Capture Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #38bdf8;
    --primary-dark: #0ea5e9;
    --primary-deeper: #0284c7;
    --primary-light: #e0f2fe;
    --primary-subtle: #f0f9ff;
    --accent: #fb923c;
    --accent-dark: #f97316;
    --accent-light: #ffedd5;
    --accent-subtle: #fff7ed;
    --card: #ffffff;
    --bg: #f0f9ff;
    --text: #0c4a6e;
    --text-light: #64748b;
    --text-muted: #94a3b8;
    --border: #cbd5e1;
    --error: #dc2626;
    --error-bg: #fef2f2;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --shadow: 0 12px 48px rgba(56, 189, 248, 0.15);
    --shadow-sm: 0 4px 16px rgba(56, 189, 248, 0.08);
    --radius: 18px;
    --radius-sm: 12px;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(251, 146, 60, 0.06) 0%, transparent 50%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    line-height: 1.6;
    position: relative;
  }

  .container {
    width: 100%;
    max-width: 740px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: var(--card);
    border-radius: 32px;
    box-shadow: var(--shadow);
    padding: 44px 48px 40px;
    animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
    border: 2px solid rgba(56, 189, 248, 0.15);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
    background-size: 200% 100%;
    animation: rainbow 3s linear infinite;
  }

  @keyframes rainbow {
    0% { background-position: 0% 0%; }
    100% { background-position: 300% 0%; }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.85) translateY(30px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .brand {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 2px dashed var(--border);
    position: relative;
  }

  .brand-logo {
    width: 80px;
    height: 80px;
    display: block;
    margin: 0 auto 14px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2);
    background: #fff;
    padding: 6px;
    border: 3px solid var(--accent);
    transition: transform 0.3s;
  }
  .brand-logo:hover { transform: translateY(-3px) scale(1.05); }

  .brand-name {
    font-size: 1.7rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }

  .title-row {
    text-align: center;
    margin-bottom: 28px;
  }

  .title-row h1 {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--text-light);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .title-row h1 span {
    color: var(--accent);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 22px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group.full-width {
    grid-column: 1 / -1;
  }

  label {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 5px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  label .required {
    color: var(--error);
    font-size: 1rem;
  }



  input[type="text"],
  input[type="email"],
  input[type="number"],
  textarea {
    font: inherit;
    font-family: 'Nunito', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 16px;
    outline: none;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: #fff;
    width: 100%;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(56, 189, 248, 0.04);
  }

  input::placeholder,
  textarea::placeholder {
    color: #94a3b8;
    font-weight: 400;
    font-size: 0.85rem;
  }

  input:focus,
  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 5px rgba(56, 189, 248, 0.15);
    background: #fff;
    transform: scale(1.01);
  }

  input:hover:not(:focus),
  textarea:hover:not(:focus) {
    border-color: var(--accent);
    background: var(--accent-subtle);
  }

  input.error,
  textarea.error {
    border-color: var(--error);
    box-shadow: 0 0 0 5px rgba(225, 29, 72, 0.1);
    background: #fff;
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-1deg); }
    40% { transform: translateX(8px) rotate(1deg); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .error-msg {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--error);
    margin-top: 5px;
    min-height: 1.3em;
    display: flex;
    align-items: center;
    gap: 5px;
    animation: slideDown 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .error-msg:empty { min-height: 0; margin: 0; }

  textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.5;
  }

  .checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 4px;
  }

  .checkbox-label {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    padding: 10px 18px;
    border: 2px solid var(--border);
    border-radius: 14px;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: #fff;
    user-select: none;
  }

  .checkbox-label:hover {
    border-color: var(--primary);
    background: var(--primary-subtle);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
  }

  .checkbox-label input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .checkbox-label .check-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border: 2px solid #d4b8c8;
    border-radius: 6px;
    transition: all 0.2s;
    flex-shrink: 0;
    background: #fff;
  }

  .checkbox-label .check-box svg {
    opacity: 0;
    transform: scale(0) rotate(-45deg);
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .checkbox-label input[type="checkbox"]:checked + .check-box {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
  }

  .checkbox-label input[type="checkbox"]:checked + .check-box svg {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  .checkbox-label:has(input:checked) {
    border-color: var(--primary);
    background: linear-gradient(135deg, var(--primary-subtle), #fff);
    box-shadow: 0 4px 16px rgba(56, 189, 248, 0.12);
  }

  .submit-btn {
    grid-column: 1 / -1;
    margin-top: 12px;
    padding: 16px 32px;
    font: inherit;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border: none;
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 6px 24px rgba(56, 189, 248, 0.35);
    letter-spacing: 0.02em;
    position: relative;
    overflow: hidden;
  }

  .submit-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15));
    pointer-events: none;
    border-radius: 18px;
  }

  .submit-btn:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 10px 32px rgba(56, 189, 248, 0.45);
  }

  .submit-btn:active:not(:disabled) {
    transform: translateY(0) scale(0.97);
    box-shadow: 0 4px 16px rgba(56, 189, 248, 0.25);
  }

  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: none;
  }

  .spinner {
    width: 22px;
    height: 22px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }

  .submit-btn.loading .spinner { display: inline-block; }
  .submit-btn.loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .message {
    grid-column: 1 / -1;
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 0.9rem;
    font-weight: 700;
    display: none;
    animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .message.success {
    display: block;
    background: var(--success-bg);
    color: var(--success);
    border: 2px solid #86efac;
  }

  .message.error {
    display: block;
    background: var(--error-bg);
    color: var(--error);
    border: 2px solid #fda4af;
  }

  .thank-you {
    text-align: center;
    padding: 30px 20px 10px;
    display: none;
    animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .thank-you.show { display: block; }

  .thank-you .icon {
    width: 88px;
    height: 88px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #f0fdf4, #dcfce7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: bounceCheck 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 3px solid #86efac;
    position: relative;
  }

  @keyframes bounceCheck {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); }
    80% { transform: scale(0.95); }
    100% { transform: scale(1); opacity: 1; }
  }

  .thank-you .icon svg { width: 40px; height: 40px; }

  .thank-you h2 {
    font-size: 1.7rem;
    font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .thank-you p {
    color: var(--text-light);
    font-size: 1rem;
    font-weight: 600;
    max-width: 400px;
    margin: 0 auto;
  }

  .thank-you .submit-btn {
    display: inline-flex;
    margin-top: 28px;
    background: linear-gradient(135deg, #475569, #334155);
    box-shadow: 0 6px 20px rgba(71, 85, 105, 0.3);
    padding: 14px 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  }
  .thank-you .submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(251, 146, 60, 0.4);
  }

  .form-content.hidden { display: none; }

  /* confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 999;
    border-radius: 3px;
    animation: confettiFall var(--dur) linear forwards;
  }

  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.5); }
  }

  /* character count */
  .char-count {
    text-align: right;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-light);
    margin-top: 4px;
    opacity: 0.6;
  }

  @media (max-width: 640px) {
    body { padding: 16px 12px; }
    .card { padding: 28px 20px 32px; border-radius: 24px; }
    .form-grid { grid-template-columns: 1fr; gap: 16px; }
    .form-group.full-width { grid-column: 1; }
    .submit-btn { grid-column: 1; }
    .message { grid-column: 1; }
    .brand { margin-bottom: 16px; padding-bottom: 14px; }
    .brand-name { font-size: 1.35rem; }
    .brand-logo { width: 64px; height: 64px; }
    .title-row h1 { font-size: 0.85rem; }
    .checkbox-label { padding: 8px 14px; font-size: 0.82rem; }
    input, textarea { font-size: 16px; }
    .floatie { display: none; }
  }
</style>
</head>
<body>

<div class="container" id="app">
  <div class="card" id="mainCard">
    <div class="brand">
      <img src="logo.png" alt="Company Logo" class="brand-logo" id="brandLogo">
      <div class="brand-name" id="companyName">UBUNIFU BYTES</div>
    </div>

    <div class="form-content" id="formContent">
      <div class="title-row">
        <h1>Akili <span>Quest</span>Initiative</h1>
      </div>

      <form id="leadForm" novalidate>
        <div class="form-grid">

          <div class="form-group full-width">
            <label for="schoolName">School Name <span class="required">*</span></label>
            <input type="text" id="schoolName" name="schoolName" placeholder="e.g. Sunshine Academy" required>
            <div class="error-msg" id="schoolNameError"></div>
          </div>

          <div class="form-group">
            <label for="contactPerson">Contact Person <span class="required">*</span></label>
            <input type="text" id="contactPerson" name="contactPerson" placeholder="Full name" required>
            <div class="error-msg" id="contactPersonError"></div>
          </div>

          <div class="form-group">
            <label for="position">Position <span class="required">*</span></label>
            <input type="text" id="position" name="position" placeholder="Head Teacher, Teacher, Parent, etc." required>
            <div class="error-msg" id="positionError"></div>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number <span class="required">*</span></label>
            <input type="text" id="phone" name="phone" placeholder="e.g. +254 712 345 678" required>
            <div class="error-msg" id="phoneError"></div>
          </div>

          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <div class="error-msg" id="emailError"></div>
          </div>

          <div class="form-group">
            <label for="county">County <span class="required">*</span></label>
            <input type="text" id="county" name="county" placeholder="e.g. Nairobi" required>
            <div class="error-msg" id="countyError"></div>
          </div>

          <div class="form-group">
            <label for="subCounty">Sub-County <span class="required">*</span></label>
            <input type="text" id="subCounty" name="subCounty" placeholder="e.g. Westlands" required>
            <div class="error-msg" id="subCountyError"></div>
          </div>

          <div class="form-group">
            <label for="numLearners">Number of Learners to Register <span class="required">*</span></label>
            <input type="number" id="numLearners" name="numLearners" placeholder="e.g. 50" min="1" required>
            <div class="error-msg" id="numLearnersError"></div>
          </div>

          <div class="form-group full-width">
            <label>Grade(s) <span class="required">*</span></label>
            <div class="checkbox-group" id="gradesGroup">
              <label class="checkbox-label">
                <input type="checkbox" name="grades" value="Grade 4">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Grade 4</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="grades" value="Grade 5">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Grade 5</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="grades" value="Grade 6">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Grade 6</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="grades" value="Grade 7">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Grade 7</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="grades" value="Grade 8">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Grade 8</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="grades" value="Grade 9">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Grade 9</span>
              </label>
            </div>
            <div class="error-msg" id="gradesError"></div>
          </div>

          <div class="form-group full-width">
            <label>Competition Category <span class="required">*</span></label>
            <div class="checkbox-group" id="categoriesGroup">
              <label class="checkbox-label">
                <input type="checkbox" name="categories" value="Mathematics Decathlon">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Mathematics Decathlon</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="categories" value="Science Project Showcase & Defence">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Science Project Showcase & Defence</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="categories" value="Spelling Bee">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Spelling Bee</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="categories" value="Creative Arts">
                <span class="check-box">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="check-label">Creative Arts</span>
              </label>
            </div>
            <div class="error-msg" id="categoriesError"></div>
          </div>

          <div class="form-group full-width">
            <label for="additionalInfo">Additional Information</label>
            <textarea id="additionalInfo" name="additionalInfo" placeholder="Any other details you'd like to share..." maxlength="500"></textarea>
            <div class="char-count"><span id="charCount">0</span>/500</div>
          </div>

          <div class="message" id="formMessage"></div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <span class="btn-text">Submit</span>
            <span class="spinner"></span>
          </button>

        </div>
      </form>
    </div>

    <div class="thank-you" id="thankYou">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h2>Thank You!</h2>
      <p>Your information has been submitted successfully. We will be in touch shortly!</p>
      <button class="submit-btn" onclick="resetForm()">Submit Another</button>
    </div>
  </div>
</div>

<script>
(function() {
  const COMPANY_NAME = "UBUNIFU BYTES";
  const LOGO_URL = "image/logo.png";
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXQB8sLaPcvt96j5YO4Tag9tHJjxF6TA313rkapgjRXtqhWQKCLtp_6r1q8l0Yg6aTZw/exec";

  const form = document.getElementById("leadForm");
  const formContent = document.getElementById("formContent");
  const thankYou = document.getElementById("thankYou");
  const message = document.getElementById("formMessage");
  const submitBtn = document.getElementById("submitBtn");
  const card = document.getElementById("mainCard");

  document.getElementById("companyName").textContent = COMPANY_NAME;
  document.getElementById("brandLogo").src = LOGO_URL;

  // character counter
  const additionalInfo = document.getElementById("additionalInfo");
  const charCount = document.getElementById("charCount");
  if (additionalInfo && charCount) {
    additionalInfo.addEventListener("input", () => {
      charCount.textContent = additionalInfo.value.length;
    });
  }

  const fields = [
    { id: "schoolName", label: "School Name" },
    { id: "contactPerson", label: "Contact Person" },
    { id: "position", label: "Position" },
    { id: "phone", label: "Phone Number" },
    { id: "email", label: "Email Address", type: "email" },
    { id: "county", label: "County" },
    { id: "subCounty", label: "Sub-County" },
    { id: "numLearners", label: "Number of Learners", type: "number" },
  ];

  function getVal(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : "";
  }

  function setError(id, msg) {
    const input = document.getElementById(id);
    const errEl = document.getElementById(id + "Error");
    if (input) input.classList.toggle("error", !!msg);
    if (errEl) errEl.textContent = msg;
  }

  function clearErrors() {
    fields.forEach(f => setError(f.id, ""));
    setError("grades", "");
    setError("categories", "");
    message.className = "message";
    message.textContent = "";
    message.style.display = "none";
  }

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
  }

  function getCheckedValues(name) {
    return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb => cb.value);
  }

  function validate() {
    let valid = true;

    fields.forEach(f => {
      const val = getVal(f.id);
      if (!val) {
        setError(f.id, `${f.label} is required`);
        valid = false;
        return;
      }
      if (f.type === "email") {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!re.test(val)) {
          setError(f.id, "Hmm, that email doesn't look right");
          valid = false;
          return;
        }
      }
      if (f.type === "number") {
        const num = parseInt(val, 10);
        if (isNaN(num) || num < 1) {
          setError(f.id, "Please enter a number 1 or more");
          valid = false;
          return;
        }
      }
      setError(f.id, "");
    });

    const grades = getCheckedValues("grades");
    if (grades.length === 0) {
      document.getElementById("gradesError").textContent = "Pick at least one grade";
      valid = false;
    } else {
      document.getElementById("gradesError").textContent = "";
    }

    const cats = getCheckedValues("categories");
    if (cats.length === 0) {
      document.getElementById("categoriesError").textContent = "Pick at least one category";
      valid = false;
    } else {
      document.getElementById("categoriesError").textContent = "";
    }

    return valid;
  }

  // confetti
  function fireConfetti() {
    const colors = ['#38bdf8', '#0ea5e9', '#fb923c', '#f97316', '#60a5fa', '#fde68a', '#34d399', '#a78bfa'];
    const shapes = ['■', '●', '▲', '★', '♦'];
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '-10px';
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      el.style.fontSize = (6 + Math.random() * 10) + 'px';
      el.style.setProperty('--dur', (1.5 + Math.random() * 2) + 's');
      el.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }

  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    clearErrors();
    if (!validate()) {
      card.style.animation = 'shake 0.4s ease';
      setTimeout(() => card.style.animation = '', 500);
      return;
    }

    const payload = {
      schoolName: getVal("schoolName"),
      contactPerson: getVal("contactPerson"),
      position: getVal("position"),
      phone: getVal("phone"),
      email: getVal("email"),
      county: getVal("county"),
      subCounty: getVal("subCounty"),
      numLearners: getVal("numLearners"),
      grades: getCheckedValues("grades").join(", "),
      categories: getCheckedValues("categories").join(", "),
      additionalInfo: getVal("additionalInfo") || "",
    };

    submitBtn.disabled = true;
    submitBtn.classList.add("loading");

    if (!SCRIPT_URL) {
      showMessage("Google Sheets URL is not configured", "error");
      submitBtn.disabled = false;
      submitBtn.classList.remove("loading");
      return;
    }

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      formContent.classList.add("hidden");
      formContent.style.display = "none";
      thankYou.classList.add("show");
      fireConfetti();
    } catch (err) {
      showMessage("Oops! Submission failed. Please try again.", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove("loading");
    }
  });

  window.resetForm = function() {
    form.reset();
    clearErrors();
    formContent.style.display = "block";
    formContent.classList.remove("hidden");
    thankYou.classList.remove("show");
    document.querySelectorAll(".error").forEach(el => el.classList.remove("error"));
    if (charCount) charCount.textContent = "0";
  };

  document.querySelectorAll("input, textarea").forEach(el => {
    el.addEventListener("input", function() {
      this.classList.remove("error");
      const errEl = document.getElementById(this.id + "Error");
      if (errEl) errEl.textContent = "";
    });
  });

  document.querySelectorAll('input[name="grades"], input[name="categories"]').forEach(cb => {
    cb.addEventListener("change", function() {
      const group = this.name === "grades" ? "gradesError" : "categoriesError";
      const el = document.getElementById(group);
      if (el) el.textContent = "";
    });
  });

  // interactive hover sounds effect — just visual sparkles on focus
  document.querySelectorAll('input, textarea, .checkbox-label').forEach(el => {
    el.addEventListener('mouseenter', function() {
      this.style.transition = 'all 0.2s';
    });
  });
})();
</script>

</body>
</html>
